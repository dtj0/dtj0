<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Devon Jones</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: #1a0f00;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      color: #ffffff;
      overflow: hidden;
      position: relative;
    }

    /* Circuit board background */
    .circuit {
      position: fixed;
      inset: 0;
      background: 
        radial-gradient(circle at 20% 30%, rgba(255, 109, 0, 0.15) 0%, transparent 50%),
        radial-gradient(circle at 80% 70%, rgba(255, 109, 0, 0.12) 0%, transparent 50%),
        linear-gradient(135deg, #1a0f00 0%, #2a1500 100%);
      z-index: 0;
    }

    .circuit::before {
      content: '';
      position: absolute;
      inset: 0;
      background-image: 
        linear-gradient(rgba(255, 109, 0, 0.08) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255, 109, 0, 0.08) 1px, transparent 1px);
      background-size: 40px 40px;
      animation: gridMove 20s linear infinite;
    }

    @keyframes gridMove {
      0% { transform: translate(0, 0); }
      100% { transform: translate(40px, 40px); }
    }

    /* Animated circuit traces */
    .traces {
      position: fixed;
      inset: 0;
      z-index: 1;
      pointer-events: none;
    }

    .trace {
      position: absolute;
      height: 2px;
      background: linear-gradient(90deg, transparent, #ff6d00, transparent);
      opacity: 0.6;
      animation: flow 4s linear infinite;
    }

    .trace:nth-child(1) { top: 15%; left: 0; width: 60%; animation-delay: 0s; }
    .trace:nth-child(2) { top: 35%; right: 0; width: 45%; animation-delay: 1.2s; }
    .trace:nth-child(3) { top: 60%; left: 10%; width: 50%; animation-delay: 2.4s; }
    .trace:nth-child(4) { bottom: 20%; right: 5%; width: 55%; animation-delay: 0.8s; }

    @keyframes flow {
      0% { transform: translateX(-100%); opacity: 0; }
      20% { opacity: 0.7; }
      80% { opacity: 0.7; }
      100% { transform: translateX(100%); opacity: 0; }
    }

    /* Content */
    .container {
      position: relative;
      z-index: 2;
      text-align: center;
      padding: 2.5rem 1.5rem;
      max-width: 440px;
      width: 100%;
      background: rgba(26, 15, 0, 0.75);
      border: 1px solid rgba(255, 109, 0, 0.3);
      border-radius: 16px;
      backdrop-filter: blur(8px);
      box-shadow: 0 0 40px rgba(255, 109, 0, 0.15);
    }

    h1 {
      font-size: 2.3rem;
      font-weight: 600;
      margin-bottom: 0.4rem;
      letter-spacing: -0.5px;
      text-shadow: 0 0 20px rgba(255, 109, 0, 0.4);
    }

    p.subtitle {
      color: #ffb380;
      margin-bottom: 2.2rem;
      font-size: 1.05rem;
    }

    .buttons {
      display: flex;
      flex-direction: column;
      gap: 0.9rem;
    }

    a.button {
      display: block;
      padding: 1rem 1.5rem;
      border-radius: 10px;
      text-decoration: none;
      font-weight: 500;
      font-size: 1.05rem;
      transition: transform 0.15s ease, box-shadow 0.15s ease;
    }

    a.button:hover {
      transform: translateY(-2px);
    }

    .linkedin {
      background: #0a66c2;
      color: white;
    }

    .linkedin:hover {
      box-shadow: 0 0 20px rgba(10, 102, 194, 0.5);
    }

    .credly {
      background: #ff6d00;
      color: white;
    }

    .credly:hover {
      box-shadow: 0 0 20px rgba(255, 109, 0, 0.6);
    }

    .email {
      margin-top: 2.2rem;
      color: #ffb380;
      font-size: 0.95rem;
    }

    .email a {
      color: #ffffff;
      text-decoration: none;
      border-bottom: 1px solid rgba(255, 109, 0, 0.5);
    }

    .email a:hover {
      border-bottom-color: #ff6d00;
    }
  </style>
</head>
<body>
  <div class="circuit"></div>
  <div class="traces">
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
    <div class="trace"></div>
  </div>

  <div class="container">
    <h1>Devon Jones</h1>
    <p class="subtitle">Connect with me</p>

    <div class="buttons">
      <a class="button linkedin" href="https://www.linkedin.com/in/devon-jones-0688b3420/" target="_blank" rel="noopener">
        LinkedIn
      </a>

      <a class="button credly" href="https://www.credly.com/users/dtj0/badges/credly" target="_blank" rel="noopener">
        Certifications
      </a>
    </div>

    <div class="email">
      <a href="mailto:devon@dtj0.com">devon@dtj0.com</a>
    </div>
  </div>
</body>
</html>
